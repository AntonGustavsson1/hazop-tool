<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #e94560;
    }

    #status {
      font-size: 1.2rem;
      margin-bottom: 1.2rem;
      height: 1.6rem;
      color: #a8dadc;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 8px;
    }

    .cell {
      background: #16213e;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #0f3460;
      transform: scale(1.05);
    }

    .cell.x { color: #e94560; }
    .cell.o { color: #a8dadc; }

    .cell.win {
      background: #0f3460;
      animation: pulse 0.5s ease;
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    #reset {
      margin-top: 1.8rem;
      padding: 0.7rem 2.2rem;
      font-size: 1rem;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s, transform 0.1s;
    }

    #reset:hover {
      background: #c73652;
      transform: scale(1.05);
    }

    #scores {
      display: flex;
      gap: 2.5rem;
      margin-bottom: 1.5rem;
      font-size: 1rem;
    }

    .score-box {
      text-align: center;
    }

    .score-box .label { color: #888; font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; }
    .score-box .value { font-size: 1.8rem; font-weight: bold; }
    .score-box.x .value { color: #e94560; }
    .score-box.o .value { color: #a8dadc; }
    .score-box.draw .value { color: #888; }
  </style>
</head>
<body>

<h1>Tic Tac Toe</h1>

<div id="scores">
  <div class="score-box x">
    <div class="label">X</div>
    <div class="value" id="score-x">0</div>
  </div>
  <div class="score-box draw">
    <div class="label">Draw</div>
    <div class="value" id="score-draw">0</div>
  </div>
  <div class="score-box o">
    <div class="label">O</div>
    <div class="value" id="score-o">0</div>
  </div>
</div>

<div id="status">X's turn</div>

<div id="board">
  <div class="cell" data-i="0"></div>
  <div class="cell" data-i="1"></div>
  <div class="cell" data-i="2"></div>
  <div class="cell" data-i="3"></div>
  <div class="cell" data-i="4"></div>
  <div class="cell" data-i="5"></div>
  <div class="cell" data-i="6"></div>
  <div class="cell" data-i="7"></div>
  <div class="cell" data-i="8"></div>
</div>

<button id="reset">New Game</button>

<script>
  const WINS = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  let board = Array(9).fill(null);
  let current = 'X';
  let gameOver = false;
  const scores = { X: 0, O: 0, draw: 0 };

  const cells = document.querySelectorAll('.cell');
  const status = document.getElementById('status');

  cells.forEach(cell => cell.addEventListener('click', () => {
    const i = +cell.dataset.i;
    if (gameOver || board[i]) return;

    board[i] = current;
    cell.textContent = current;
    cell.classList.add(current.toLowerCase(), 'taken');

    const win = checkWin();
    if (win) {
      win.forEach(idx => cells[idx].classList.add('win'));
      status.textContent = `${current} wins!`;
      scores[current]++;
      updateScores();
      gameOver = true;
    } else if (board.every(Boolean)) {
      status.textContent = "It's a draw!";
      scores.draw++;
      updateScores();
      gameOver = true;
    } else {
      current = current === 'X' ? 'O' : 'X';
      status.textContent = `${current}'s turn`;
    }
  }));

  document.getElementById('reset').addEventListener('click', reset);

  function checkWin() {
    for (const combo of WINS) {
      if (combo.every(i => board[i] === current)) return combo;
    }
    return null;
  }

  function updateScores() {
    document.getElementById('score-x').textContent = scores.X;
    document.getElementById('score-o').textContent = scores.O;
    document.getElementById('score-draw').textContent = scores.draw;
  }

  function reset() {
    board = Array(9).fill(null);
    current = 'X';
    gameOver = false;
    status.textContent = "X's turn";
    cells.forEach(cell => {
      cell.textContent = '';
      cell.className = 'cell';
    });
  }
</script>
</body>
</html>
